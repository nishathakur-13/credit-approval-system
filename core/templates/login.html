<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>FinanceGuard | Secure Portal</title>
</head>
<body class="bg-[#0f172a] text-white font-sans flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 space-y-6 bg-[#1e293b] rounded-2xl shadow-2xl border border-slate-700">
        <div class="text-center">
            <div class="bg-blue-600 w-12 h-12 rounded-lg flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/50">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <h2 class="text-3xl font-extrabold tracking-tight">FinanceGuard</h2>
            <p class="text-slate-400 text-sm mt-2">Unified Credit Management System</p>
        </div>
        <form class="space-y-4" method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" class="w-full px-4 py-3 bg-[#0f172a] border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            <input type="password" name="password" placeholder="Password" class="w-full px-4 py-3 bg-[#0f172a] border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-xl font-bold text-lg shadow-lg transition-transform active:scale-95">LOGIN</button>
        </form>
        <div class="text-center pt-4 border-t border-slate-700">
            <a href="/signup" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Create a fresh account →</a>
        </div>
    </div>
</body>
</html>
